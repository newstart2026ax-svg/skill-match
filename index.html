<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Match — Phoenix (Prototype)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --navy:#0A1628; --navy2:#10233D; --navy3:#16304F;
    --gold:#C9A227; --gold-light:#E7C65C; --gold-dark:#9A7B1A;
    --ink:#F2F4F7; --muted:#A9B6C6; --dim:#6E7E93;
    --card:#0F2038; --line:#24405F;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--navy); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:17px; line-height:1.45;}
  .wrap{max-width:520px; margin:0 auto; padding:0 16px 40px;}
  header{position:sticky; top:0; z-index:10; background:var(--navy);
    border-bottom:2px solid var(--gold); padding:14px 16px 10px;}
  .header-in{max-width:520px; margin:0 auto; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  h1{font-size:22px; margin:0; letter-spacing:.3px;}
  h1 .gold{color:var(--gold);}
  .tagline{color:var(--muted); font-size:14px; margin-top:2px;}
  #langBtn{background:var(--navy2); color:var(--gold-light); border:1px solid var(--gold-dark);
    border-radius:999px; padding:8px 14px; font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap;}
  h2{font-size:20px; margin:22px 0 6px;}
  .help{color:var(--muted); font-size:15px; margin:0 0 12px;}
  textarea{width:100%; min-height:96px; background:var(--navy2); color:var(--ink);
    border:1px solid var(--line); border-radius:var(--radius); padding:12px; font-size:16px; resize:vertical;}
  textarea:focus{outline:2px solid var(--gold-dark);}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px;}
  .chip{background:var(--navy2); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:9px 13px; font-size:15px; cursor:pointer;}
  .chip.on{background:var(--gold); border-color:var(--gold); color:#14100a; font-weight:700;}
  .btn{display:block; width:100%; border:none; border-radius:var(--radius); cursor:pointer;
    background:var(--gold); color:#14100a; font-size:18px; font-weight:800; padding:15px; margin-top:18px;}
  .btn.secondary{background:var(--navy2); color:var(--gold-light); border:1px solid var(--gold-dark); font-weight:700;}
  .skill-list{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px;}
  .skill{display:inline-flex; align-items:center; gap:8px; background:var(--navy3);
    border:1px solid var(--line); border-radius:999px; padding:8px 8px 8px 13px; font-size:15px;}
  .skill.trans{background:#1A2A17; border-color:#3d5a2e;}
  .skill.custom{background:#2A2118; border-color:#8a6d2f;}
  .skill button{background:var(--gold); border:none; color:#14100a; width:24px; height:24px;
    border-radius:50%; font-size:15px; font-weight:800; cursor:pointer; line-height:1;}
  .skill.trans button{background:#7ba05b;}
  .group-label{font-size:14px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); margin:20px 0 2px; font-weight:700;}
  .group-sub{color:var(--muted); font-size:14px; margin:0;}
  .banner{background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); color:#171106;
    border-radius:var(--radius); padding:14px 16px; font-weight:800; font-size:16.5px; margin:18px 0 10px;}
  .withheld{color:var(--muted); font-size:14px; margin:0 0 6px;}
  .withheld b{color:var(--gold-light);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px; margin:14px 0;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .job-title{font-size:18px; font-weight:800; margin:0;}
  .employer{color:var(--gold-light); font-size:15px; margin:1px 0 0;}
  .meta{color:var(--muted); font-size:14.5px; margin-top:2px;}
  .pct{background:var(--gold); color:#14100a; font-weight:800; border-radius:10px;
    padding:7px 10px; font-size:16px; white-space:nowrap; text-align:center;}
  .pct small{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
  .adjacent{display:inline-block; background:#22354F; border:1px solid var(--gold-dark); color:var(--gold-light);
    border-radius:8px; font-size:13.5px; font-weight:700; padding:4px 9px; margin-top:9px;}
  .why{font-size:14.5px; margin:10px 0 0;}
  .why b{color:var(--gold-light);}
  .needs{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .need{font-size:13px; border-radius:999px; padding:4px 9px; border:1px solid var(--line); color:var(--dim);}
  .need.hit{border-color:var(--gold); color:var(--gold-light); font-weight:700;}
  .need-label{font-size:13px; color:var(--muted); margin-top:10px;}
  .expiry{margin-top:12px; font-size:15px; font-weight:700; color:var(--gold-light);
    border-top:1px dashed var(--line); padding-top:10px;}
  .expiry.urgent{color:#FFB03A;}
  .apply{display:block; text-align:center; text-decoration:none; margin-top:10px;
    background:var(--gold); color:#14100a; font-weight:800; font-size:16.5px;
    border-radius:11px; padding:13px;}
  .apply-note{color:var(--dim); font-size:12.5px; text-align:center; margin-top:6px;}
  .stamp{color:var(--dim); font-size:13px; margin-top:10px;}
  footer{border-top:1px solid var(--line); margin-top:28px; padding-top:14px;
    color:var(--muted); font-size:13.5px;}
  .hidden{display:none !important;}
  .empty{color:var(--muted); font-size:15px; padding:10px 0;}
</style>
</head>
<body>
<header>
  <div class="header-in">
    <div>
      <h1>Skill<span class="gold">Match</span> · Phoenix</h1>
      <div class="tagline" id="tagline"></div>
    </div>
    <button id="langBtn" type="button">Español</button>
  </div>
</header>

<div class="wrap">

  <!-- VIEW 1: INTAKE -->
  <section id="viewIntake">
    <h2 id="intakeH"></h2>
    <p class="help" id="intakeHelp"></p>
    <textarea id="skillText"></textarea>
    <p class="empty hidden" id="intakeHint"></p>
    <h2 id="chipsH" style="font-size:16px; margin-top:18px;"></h2>
    <div class="chips" id="chips"></div>
    <button class="btn" id="buildBtn" type="button"></button>
  </section>

  <!-- VIEW 2: PROFILE -->
  <section id="viewProfile" class="hidden">
    <h2 id="profileH"></h2>
    <div class="group-label" id="directH"></div>
    <div class="skill-list" id="directList"></div>
    <div class="group-label" id="transH"></div>
    <p class="group-sub" id="transSub"></p>
    <div class="skill-list" id="transList"></div>
    <div class="group-label hidden" id="customH"></div>
    <p class="group-sub hidden" id="customSub"></p>
    <div class="skill-list" id="customList"></div>
    <p class="help" id="addedNote"></p>
    <p class="empty hidden" id="profileEmpty"></p>
    <button class="btn" id="findBtn" type="button"></button>
    <button class="btn secondary" id="editBtn" type="button"></button>
  </section>

  <!-- VIEW 3: RESULTS -->
  <section id="viewResults" class="hidden">
    <div class="banner" id="banner"></div>
    <p class="withheld" id="withheld"></p>
    <h2 id="resultsH"></h2>
    <p class="help" id="resultsCount"></p>
    <div id="cards"></div>
    <p class="empty hidden" id="noMatch"></p>
    <button class="btn secondary" id="backProfileBtn" type="button"></button>
  </section>

  <footer id="footerNote"></footer>
</div>

var lang = "en";

var customSkills = [];     /* the worker's own words, kept as typed */
var lastAdded = null;      /* {a: recognized count, b: custom count} from the last Build */

var workerTitleKey = "general";

function t(){ return STR[lang]; }
function skillLabel(id){ return SKILLS[id][lang]; }
function has(obj, k){ return Object.prototype.hasOwnProperty.call(obj, k); }

/* ============ PHRASE -> SKILL MAPPING ============ */
function parseTextToSkills(text){
  var found = {};
  var s = " " + (text || "").toLowerCase() + " ";
  for (var id in KEYWORDS){
    var phrases = KEYWORDS[id];
    for (var i = 0; i < phrases.length; i++){
      if (s.indexOf(phrases[i]) !== -1){ found[id] = true; break; }
    }
  }
  if (/\b\d{2,3}\s?(lbs?|pounds|libras)\b/.test(s)) found["lifting"] = true;
  return found;
}

/* Strip lead-ins so the worker's phrase stands on its own */
function cleanPhrase(p){
  var s = (p || "").trim().toLowerCase().replace(/\s+/g, " ");
  s = s.replace(/^(i can|i know how to|i know|i have|i do|i've|i am|i'm|i|yo puedo|yo tengo|yo s\u00e9|yo se|tengo|puedo|s\u00e9|se|my|mis|mi)\s+/, "");
  return s.trim();
}

/* Free text: recognized phrases map to skills; EVERYTHING else the worker
   wrote is kept as a custom skill in their own words. Nothing is dropped. */
function parseSubmission(text){
  var found = parseTextToSkills(text);
  var raw = (text || "").replace(/\n/g, ",");
  var parts = raw.split(/[,;.]+|\band\b|\by\b/);
  var customs = [];
  for (var i = 0; i < parts.length; i++){
    var seg = " " + parts[i].toLowerCase() + " ";
    var segMatched = false;
    for (var id in KEYWORDS){
      var phrases = KEYWORDS[id];
      for (var j = 0; j < phrases.length; j++){ if (seg.indexOf(phrases[j]) !== -1){ segMatched = true; break; } }
      if (segMatched) break;
    }
    if (segMatched) continue;
    if (/\b\d{2,3}\s?(lbs?|pounds|libras)\b/.test(seg)) continue; /* lifting already mapped */
    var c = cleanPhrase(parts[i]);
    if (c.length < 3 || c.length > 60) continue;
    if (/^(work|job|jobs|trabajo|empleo|stuff|cosas|more|mas|m\u00e1s|anything|todo)$/.test(c)) continue;
    if (/^(need|looking for|busco|quiero|want)\b/.test(c)) continue; /* job-hunting words, not skills */
    var dup = false;
    for (var k = 0; k < customs.length; k++) if (customs[k].toLowerCase() === c) dup = true;
    for (var m = 0; m < customSkills.length; m++) if (customSkills[m].toLowerCase() === c) dup = true;
    if (!dup) customs.push(c.charAt(0).toUpperCase() + c.slice(1));
  }
  return {found: found, customs: customs};
}

function inferTitleKey(text){
  var s = " " + (text || "").toLowerCase() + " ";
  if (s.indexOf("line cook") !== -1 || has(directSkills,"grill_op")) return "line-cook";
  if (s.indexOf("prep cook") !== -1) return "prep-cook";
  if (s.indexOf("dishwasher") !== -1 || s.indexOf("dish pit") !== -1) return "dishwasher";
  if (s.indexOf("forklift") !== -1) return "forklift";
  if (s.indexOf("warehouse") !== -1 || has(directSkills,"picking")) return "warehouse";
  if (has(directSkills,"line_cook")) return "line-cook";
  if (has(directSkills,"dish")) return "dishwasher";
  if (has(directSkills,"caregiving")) return "caregiver";
  if (has(directSkills,"childcare")) return "childcare";
  if (has(directSkills,"data_entry") || has(directSkills,"office_software")) return "admin";
  if (has(directSkills,"serving") || has(directSkills,"bartending") || has(directSkills,"barista")) return "server";
  if (has(directSkills,"housekeeping")) return "housekeeper";
  if (has(directSkills,"construction_labor") || has(directSkills,"landscaping")) return "laborer";
  if (has(directSkills,"delivery_driving")) return "driver";
  if (has(directSkills,"security_guard")) return "security";
  if (has(directSkills,"basic_repairs")) return "maintenance";
  if (has(directSkills,"baking")) return "baker";
  return "general";
}

/* Transferable skills currently in the profile (derived, minus user-removed) */
function currentTrans(){
  var out = {};
  for (var id in directSkills){
    var list = TRANSFERS[id] || [];
    for (var i = 0; i < list.length; i++){
      if (!removedTrans[list[i]]) out[list[i]] = true;
    }
  }
  return out;
}

/* ============ MATCHING ============ */
function addDays(base, n){ var d = new Date(base.getFullYear(), base.getMonth(), base.getDate()); d.setDate(d.getDate() + n); return d; }
function fmtDate(d){ return d.toLocaleDateString(lang === "es" ? "es-ES" : "en-US", {month:"short", day:"numeric"}); }

function listingSearchText(L){
  var parts = [L.title, L.titleEs];
  for (var i = 0; i < L.req.length; i++){ parts.push(SKILLS[L.req[i]].en); parts.push(SKILLS[L.req[i]].es); }
  return " " + parts.join(" ").toLowerCase() + " ";
}
function tokenize(s){
  return s.toLowerCase().split(/[^a-z\u00e1\u00e9\u00ed\u00f3\u00fa\u00f1\u00fc]+/).filter(function(w){ return w.length > 3; });
}

function scoreListing(L, trans){
  var got = 0, matched = [], matchedSet = {}, coreHits = 0;
  for (var i = 0; i < L.req.length; i++){
    var r = L.req[i];
    if (has(directSkills, r)){ got += 2; matched.push(r); matchedSet[r] = true; coreHits++; }
    else if (has(trans, r)){ got += 1; matched.push(r); matchedSet[r] = true; }
  }
  /* The worker's own words count too: a custom phrase whose words show up
     in the listing's title or required skills earns credit (max 2 phrases). */
  var customHits = [];
  if (customSkills.length){
    var lt = listingSearchText(L);
    for (var c = 0; c < customSkills.length && customHits.length < 2; c++){
      var toks = tokenize(customSkills[c]);
      for (var q = 0; q < toks.length; q++){
        if (lt.indexOf(" " + toks[q]) !== -1){ customHits.push(customSkills[c]); break; }
      }
    }
    got += customHits.length;
  }
  var pct = L.req.length ? Math.round(100 * got / (2 * L.req.length)) : 0;
  if (pct > 100) pct = 100;
  /* Anchor rule: a job is a STRONG match only if at least one real (core)
     skill is shared, or the worker's own words name the work. Transferable
     traits alone can raise a score but never create a strong match. */
  var anchor = coreHits > 0 || customHits.length > 0;
  return {pct: pct, matched: matched, matchedSet: matchedSet, customHits: customHits, anchor: anchor};
}

/* ============ RENDERING ============ */
var $ = function(id){ return document.getElementById(id); };

/* Escape untrusted strings before they are interpolated into innerHTML.
   Feed fields (jobs.json) and worker-entered phrases are untrusted input
   permanently — a listing or phrase containing markup must render as
   text, never as HTML. */
function esc(s){
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function applyStaticText(){
  document.documentElement.lang = lang;
  $("tagline").textContent = t().tagline;
  $("langBtn").textContent = lang === "en" ? "Espa\u00f1ol" : "English";
  $("intakeH").textContent = t().intakeH;
  $("intakeHelp").textContent = t().intakeHelp;
  $("skillText").placeholder = t().placeholder;
  $("chipsH").textContent = t().chipsH;
  $("buildBtn").textContent = t().build;
  $("profileH").textContent = t().profileH;
  $("directH").textContent = t().directH;
  $("transH").textContent = t().transH;
  $("transSub").textContent = t().transSub;
  $("customH").textContent = t().customH;
  $("customSub").textContent = t().customSub;
  $("findBtn").textContent = t().find;
  $("editBtn").textContent = t().edit;
  $("profileEmpty").textContent = t().empty;
  $("resultsH").textContent = t().resultsH;
  $("banner").textContent = t().banner;
  $("noMatch").textContent = t().noMatch;
  $("backProfileBtn").textContent = t().backProfile;
  $("footerNote").textContent = t().footer;
}

function renderChips(){
  var html = "";
  for (var i = 0; i < CHIPS.length; i++){
    var chip = CHIPS[i];
    var on = true;
    for (var j = 0; j < chip.skills.length; j++){ if (!has(directSkills, chip.skills[j])) on = false; }
    html += '<button type="button" class="chip' + (on ? " on" : "") + '" data-chip="' + i + '">' +
            esc(chip[lang]) + "</button>";
  }
  $("chips").innerHTML = html;
  var btns = $("chips").querySelectorAll(".chip");
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener("click", function(){
      var chip = CHIPS[parseInt(this.getAttribute("data-chip"), 10)];
      var allOn = true;
      for (var j = 0; j < chip.skills.length; j++){ if (!has(directSkills, chip.skills[j])) allOn = false; }
      for (var m = 0; m < chip.skills.length; m++){
        if (allOn) delete directSkills[chip.skills[m]];
        else directSkills[chip.skills[m]] = true;
      }
      renderChips();
    });
  }
}

function skillPill(id, isTrans){
  return '<span class="skill' + (isTrans ? " trans" : "") + '">' + esc(skillLabel(id)) +
    '<button type="button" data-remove="' + id + '" data-trans="' + (isTrans ? "1" : "0") + '" aria-label="Remove">&times;</button></span>';
}

function renderProfile(){
  var dHtml = "", ids = Object.keys(directSkills);
  for (var i = 0; i < ids.length; i++) dHtml += skillPill(ids[i], false);
  $("directList").innerHTML = dHtml;

  var trans = currentTrans();
  var tIds = Object.keys(trans);
  var tHtml = "";
  for (var j = 0; j < tIds.length; j++) tHtml += skillPill(tIds[j], true);
  $("transList").innerHTML = tHtml;

  var cHtml = "";
  for (var c = 0; c < customSkills.length; c++){
    cHtml += '<span class="skill custom">' + esc(customSkills[c]) +
      '<button type="button" data-custom="' + c + '" aria-label="Remove">&times;</button></span>';
  }
  $("customList").innerHTML = cHtml;
  $("customH").classList.toggle("hidden", !customSkills.length);
  $("customSub").classList.toggle("hidden", !customSkills.length);

  $("addedNote").textContent = (lastAdded && (lastAdded.a || lastAdded.b)) ? t().addedNote(lastAdded.a, lastAdded.b) : "";

  var total = ids.length + customSkills.length;
  $("profileEmpty").classList.toggle("hidden", total > 0);
  $("findBtn").style.opacity = total ? "1" : ".45";

  var btns = $("viewProfile").querySelectorAll("[data-remove]");
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener("click", function(){
      var id = this.getAttribute("data-remove");
      if (this.getAttribute("data-trans") === "1") removedTrans[id] = true;
      else delete directSkills[id];
      renderProfile();
    });
  }
  var cbtns = $("viewProfile").querySelectorAll("[data-custom]");
  for (var q = 0; q < cbtns.length; q++){
    cbtns[q].addEventListener("click", function(){
      customSkills.splice(parseInt(this.getAttribute("data-custom"), 10), 1);
      renderProfile();
    });
  }
}

function renderResults(){
  var today = new Date();
  var trans = currentTrans();
  var open = [], expiredCount = 0;
  for (var i = 0; i < LISTINGS.length; i++){
    var L = LISTINGS[i];
    if (L.untilOff < 0){ expiredCount++; continue; }  /* expired: never shown, never reposted */
    var sc = scoreListing(L, trans);
    open.push({L: L, pct: sc.pct, matched: sc.matched, matchedSet: sc.matchedSet, customHits: sc.customHits, anchor: sc.anchor});
  }
  open.sort(function(a, b){ return (b.pct - a.pct) || (a.L.untilOff - b.L.untilOff); });

  $("withheld").innerHTML = t().withheld(expiredCount);
  var strong = [], transfer = [], weakCount = 0;
  for (var j = 0; j < open.length; j++){
    var o = open[j];
    if (o.pct <= 0) continue;
    if (o.anchor) strong.push(o);
    else if (o.pct >= 25) transfer.push(o);
    else weakCount++;
  }
  var shown = strong.concat(transfer);
  $("resultsCount").textContent = t().resultsCount(shown.length);
  $("noMatch").classList.toggle("hidden", shown.length > 0);

  var html = "";
  if (!strong.length && transfer.length) html += '<p class="empty">' + t().noStrong + "</p>";
  for (var k = 0; k < shown.length; k++){
    var item = shown[k], L = item.L;
    if (k === strong.length && transfer.length) html += '<div class="group-label">' + t().transferH + "</div>";
    var until = addDays(today, L.untilOff);
    var posted = addDays(today, -L.postedAgo);
    var title = lang === "es" ? L.titleEs : L.title;
    html += '<article class="card">';
    html += '<div class="card-top"><div><p class="job-title">' + esc(title) + '</p>' +
            '<p class="employer">' + esc(L.employer) + '</p>' +
            '<p class="meta">' + esc(L.area) + " &middot; " + esc(L.pay) + "</p></div>" +
            '<div class="pct">' + item.pct + '%<small>' + t().matchWord + "</small></div></div>";
    if (L.titleKey !== workerTitleKey){
      html += '<span class="adjacent">' + t().adjacent + "</span>";
    }
    var whyNames = [];
    for (var m = 0; m < item.matched.length; m++) whyNames.push(esc(skillLabel(item.matched[m])));
    for (var w = 0; w < item.customHits.length; w++) whyNames.push('"' + esc(item.customHits[w]) + '"');
    html += '<p class="why"><b>' + t().why + "</b>" + whyNames.join(", ") + "</p>";
    html += '<p class="need-label">' + t().needs + '</p><div class="needs">';
    for (var n = 0; n < L.req.length; n++){
      var r = L.req[n];
      html += '<span class="need' + (item.matchedSet[r] ? " hit" : "") + '">' + esc(skillLabel(r)) + "</span>";
    }
    html += "</div>";
    html += '<p class="expiry' + (L.untilOff <= 1 ? " urgent" : "") + '">' +
            t().verifiedUntil + fmtDate(until) + " &middot; " + esc(t().daysLeft(L.untilOff)) + "</p>";
    html += '<a class="apply" href="#" onclick="return false;">' + t().apply + "</a>";
    html += '<p class="apply-note">' + t().applyNote + "</p>";
    html += '<p class="stamp">' + t().source + esc(L.source) + " &middot; " + t().posted + fmtDate(posted) + "</p>";
    html += "</article>";
  }
  if (weakCount) html += '<p class="apply-note">' + t().weakNote(weakCount) + "</p>";
  $("cards").innerHTML = html;
}

/* ============ VIEW SWITCHING ============ */
function show(view){
  $("viewIntake").classList.toggle("hidden", view !== "intake");
  $("viewProfile").classList.toggle("hidden", view !== "profile");
  $("viewResults").classList.toggle("hidden", view !== "results");
  window.scrollTo(0, 0);
}

$("buildBtn").addEventListener("click", function(){
  var text = $("skillText").value;
  var res = parseSubmission(text);
  var addedCount = 0;
  for (var id in res.found){ if (!has(directSkills, id)) addedCount++; directSkills[id] = true; }
  for (var i = 0; i < res.customs.length; i++) customSkills.push(res.customs[i]);
  lastAdded = {a: addedCount, b: res.customs.length};
  workerTitleKey = inferTitleKey(text);
  if (!Object.keys(directSkills).length && !customSkills.length){
    $("intakeHint").textContent = t().tryHint;
    $("intakeHint").classList.remove("hidden");
    return;
  }
  $("intakeHint").classList.add("hidden");
  renderProfile();
  show("profile");
});
$("editBtn").addEventListener("click", function(){ renderChips(); show("intake"); });
$("findBtn").addEventListener("click", function(){
  if (!Object.keys(directSkills).length && !customSkills.length){ renderChips(); show("intake"); return; }
  renderResults();
  show("results");
});
$("backProfileBtn").addEventListener("click", function(){ renderProfile(); show("profile"); });
$("langBtn").addEventListener("click", function(){
  lang = lang === "en" ? "es" : "en";
  applyStaticText();
  renderChips();
  renderProfile();
  if (!$("viewResults").classList.contains("hidden")) renderResults();
});

/* ============ INIT ============ */
applyStaticText();
renderChips();

/* ============ FEED LOADER ============ */
/* Listings load from jobs.json — the seam where live agency feeds plug in.
   If the feed is present and valid it replaces the built-in samples;
   if not, the samples stand. Expired postings are filtered at render. */
(function(){
  if (!window.fetch) return;
  fetch("jobs.json", {cache: "no-store"}).then(function(r){
    return r.ok ? r.json() : null;
  }).then(function(data){
    if (data && data.listings && data.listings.length){
      LISTINGS.length = 0;
      for (var i = 0; i < data.listings.length; i++) LISTINGS.push(data.listings[i]);
      if (!$("viewResults").classList.contains("hidden")) renderResults();
    }
  }).catch(function(){ /* samples stand */ });
})();

/* ============ SERVICE WORKER (installable app shell) ============ */
if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
